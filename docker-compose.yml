version: '3.8'

services:
  db:
    image: postgres:16
    container_name: project_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-project_db}
      POSTGRES_USER: ${DB_USER:-project_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-project_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-project_user} -d ${DB_NAME:-project_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sharius_backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-project_user}:${DB_PASSWORD:-project_password}@db:5432/${DB_NAME:-project_db}
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sharius_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Чтобы использовать node_modules внутри контейнера
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:9000}
      - CHOKIDAR_USEPOLLING=true # Полезно для Windows (WSL2/Docker Desktop) для горячей перезагрузки
      - VITE_WATCH_USE_POLLING=true

volumes:
  postgres_data:
